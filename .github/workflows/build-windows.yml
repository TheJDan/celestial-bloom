name: Build and Release Windows App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install

      - name: Build frontend
        run: bun run build

      - name: Build Tauri executable
        run: bun run tauri build --no-bundle
        env:
          CI: true

      - name: Publish Public Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Celestial Bloom (Build #${{ github.run_number }})"
          body: "Ejecutable directo de Celestial Bloom para Windows 10/11. Descárgalo y ábrelo con doble clic."
          files: src-tauri/target/release/*.exe
          make_latest: true
